name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL ${{ matrix.postgres }}
        run: |
          docker run --rm \
            -e POSTGRES_PASSWORD=test \
            -v "$PWD:/src:ro" \
            postgres:${{ matrix.postgres }} sh -euxc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                "postgresql-plpython3-$PG_MAJOR" >/dev/null
              extension_dir="$(pg_config --sharedir)/extension"
              cp /src/pg_prompt_jev.control "$extension_dir/"
              cp /src/sql/pg_prompt_jev--*.sql "$extension_dir/"
              docker-entrypoint.sh postgres >/tmp/postgres.log 2>&1 &
              for _ in $(seq 1 30); do
                pg_isready -U postgres && break
                sleep 1
              done
              pg_isready -U postgres
              psql -v ON_ERROR_STOP=1 -U postgres -f /src/test/smoke.sql
            '

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(sed -n "s/default_version = '\(.*\)'/\1/p" pg_prompt_jev.control)
          test -n "$version"
          test -f "sql/pg_prompt_jev--$version.sql"
          grep -Fx "DATA = sql/pg_prompt_jev--$version.sql" Makefile
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          archive="pg-jev-$VERSION.tar.gz"
          git archive --prefix="pg-jev-$VERSION/" -o "$archive" HEAD
          gh release create "v$VERSION" "$archive" \
            --target "$GITHUB_SHA" \
            --title "pg-jev $VERSION" \
            --generate-notes
