name: test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test

  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PostgreSQL ${{ matrix.postgres }}
        run: python3 test/integration/run.py --image postgres:${{ matrix.postgres }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version=$(sed -n "s/default_version = '\(.*\)'/\1/p" pg_prompt_jev.control)
          test -n "$version"
          test -f "sql/pg_prompt_jev--$version.sql"
          python3 tools/generate_sql.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Release new version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          error=$(mktemp)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" \
            >/dev/null 2>"$error"; then
            echo "v$VERSION is already released"
            exit 0
          elif ! grep -q 'HTTP 404' "$error"; then
            cat "$error" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION exists without a matching release; refusing to move it" >&2
            exit 1
          fi
          archive="pg-jev-$VERSION.tar.gz"
          git archive --prefix="pg-jev-$VERSION/" -o "$archive" "$GITHUB_SHA"
          gh release create "v$VERSION" "$archive" \
            --target "$GITHUB_SHA" \
            --title "pg-jev $VERSION" \
            --generate-notes
